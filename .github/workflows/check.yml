name: check

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

jobs:
  # The library is pure MoonBit, so it is worth proving on every backend and
  # every runner OS.
  test:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install
        uses: ./.github/actions/setup

      - name: check
        timeout-minutes: 10
        run: moon check --deny-warn --target all

      - name: test
        timeout-minutes: 15
        run: moon test --target all

      - name: test (release)
        timeout-minutes: 15
        run: moon test --release --target wasm,wasm-gc,js

  # Repository consistency: these compare committed files against what the
  # tools regenerate, so running them once is enough — a second OS would only
  # re-check the same bytes.
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install
        uses: ./.github/actions/setup

      - name: generated interfaces are up to date
        timeout-minutes: 10
        run: |
          moon info
          git diff --exit-code

      - name: formatting is clean
        timeout-minutes: 10
        run: |
          moon fmt
          git diff --exit-code

      # `#data.derive` implementations are generated by hand-run tooling rather
      # than by the build, so nothing else would notice them going stale.
      - name: derived implementations are up to date
        timeout-minutes: 10
        run: |
          moon run derive
          git diff --exit-code
